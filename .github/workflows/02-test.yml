name: Tests
on:
  push:
    branches:
      - main
      - master
    tags: ['*']
    paths:
      - '**/*.jl'
      - '**/Project.toml'
      - '.github/workflows/02-test.yml'
  pull_request:
    paths:
      - '**/*.jl'
      - '**/Project.toml'
      - '.github/workflows/02-test.yml'
  workflow_dispatch:
jobs:
  test:
    name: Run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2
        with:
          delete-old-caches: 'false'

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Remove stale coverage files
        run: julia --project=test -e 'using Coverage; clean_folder(".")'

      - name: Run tests with coverage
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'

      - name: Collect coverage files
        run: |
          mkdir -p coverage_artifact
          find . -name '*.cov' -print0 | xargs -0 -I{} cp --parents "{}" coverage_artifact/

      - name: Upload coverage files
        uses: actions/upload-artifact@v4
        with:
          name: julia-cov
          path: coverage_artifact
          retention-days: 1
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2
        with:
          delete-old-caches: 'false'

      - name: Download coverage files
        uses: actions/download-artifact@v4
        with:
          name: julia-cov
          path: .

      - name: Compute coverage and enforce 100%
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=test test/coverage.jl

  juliac:
    name: JuliaC safe trimming
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2
        with:
          delete-old-caches: 'false'

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Verify safe trimming
        run: julia --project=test test/juliac/verify.jl
